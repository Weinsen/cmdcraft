[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdcraft"
dynamic = ["version"]
description = "Library for building interactive prompt-driven developer tools from Python callables"
readme = { file = "README.rst", content-type = "text/x-rst" }
authors = [{ name = "A. M. Weinsen Jr." }]
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = ["prompt_toolkit>=3.0.52,<4"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.optional-dependencies]
dev = [
    "build",
    "coverage",
    "pytest",
    "readme_renderer",
    "ruff",
]
docs = [
    "furo",
    "sphinx",
]

[project.urls]
Homepage = "https://github.com/weinsen/cmdcraft"
Repository = "https://github.com/weinsen/cmdcraft"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "cmdcraft.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# git-cliff configuration lives in pyproject.toml and is extracted by
# tools/changelog.sh when generating release notes.
[tool.git-cliff.changelog]
header = """
Changelog
=========

"""
body = """
{% if version %}{{ version }}
------------------------------

{% else %}Unreleased
------------------------------

{% endif %}{% for group, commits in commits | group_by(attribute="group") %}{{ group }}
******************************

{% for commit in commits %}- {{ commit.message | trim | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true
render_always = false

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
commit_preprocessors = [
    { pattern = "^new:\\s*", replace = "feat: " },
    { pattern = "^doc:\\s*", replace = "docs: " },
    { pattern = "^infra:\\s*", replace = "chore(infra): " },
]
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug fixes" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(infra\\)", group = "Infrastructure" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^Merge pull request", skip = true },
    { message = "^fixup", skip = true },
    { message = "^Update version$", skip = true },
    { message = "^.*$", group = "Other" },
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.10
target-version = "py310"

[tool.ruff.lint]
select = ["RUF", "E", "W", "F", "I", "D", "UP"]
ignore = ["D203", "D213"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"